# Domaine club-digital.fr (domaine expire repris par Manon chez OVH, 27 octobre 2026).
# En production, le workflow GitHub Actions remplace baseURL par l adresse GitHub Pages
# (ou le domaine custom une fois configure dans les reglages Pages du depot).
baseURL = "https://club-digital.fr/"
title = "Club Digital"
theme = "club-digital"

defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false
removePathAccents = true
enableRobotsTXT = true

[taxonomies]
  category = "categories"
  tag = "tags"

[languages]
  [languages.fr]
    locale = "fr-FR"
    label = "Français"
    weight = 1
    title = "Club Digital"
    [languages.fr.params]
      description = "Le blog qui décrypte les logiciels, l'IA et les outils numériques : facturation, CRM, automatisation, cybersécurité et productivité."
      tagline = "Logiciels, IA et outils numériques, décryptés"

  [languages.en]
    locale = "en-US"
    label = "English"
    weight = 2
    title = "Club Digital"
    [languages.en.params]
      description = "The blog that breaks down software, AI and digital tools: invoicing, CRM, automation, cybersecurity and productivity."
      tagline = "Software, AI and digital tools, explained"

