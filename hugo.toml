[params]
  default_og_image = "/images/og-default.png"
  logo = "/favicon-512.png"
  founding_year = "2026"
  # Adresse de contact : a renseigner une fois le domaine achete. Tant que le champ
  # est vide, les pages affichent "adresse de contact en cours de creation".
  contact_email = "contact@club-digital.fr"
  expertise = ["Logiciels de gestion", "Facturation", "Comptabilité", "CRM", "Intelligence artificielle", "Automatisation", "Cybersécurité", "Cloud", "Paie", "Outils de productivité"]
  og_locale_alternate = "en_US"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]

[related]
  includeNewer = true
  threshold = 80
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = true
  [markup.goldmark.renderer]
    unsafe = true

# Contenu FR a la racine de content/, contenu EN dans content/en/
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
    files = ["! en/**"]
    [module.mounts.sites.matrix]
      languages = ["fr"]
  [[module.mounts]]
    source = "content/en"
    target = "content"
    [module.mounts.sites.matrix]
      languages = ["en"]
