# Auteurs du blog — multilingue FR/EN
# Ce fichier est copie dans `data/authors.yaml` a la racine du site Hugo a la creation du site.
# Hugo le lit nativement via `.Site.Data.authors` dans les templates.
#
# Structure : map d'auteurs indexee par ID (slug)
# L'ID est utilise dans le frontmatter des articles comme `author: thomas-durand`
#
# Le champ `topics` sert a la selection automatique de l'auteur dans /create-article.
# Le champ `expertise` alimente le schema.org Person -> knowsAbout.

thomas-durand:
  id: thomas-durand
  name: Thomas Durand
  type: person
  avatar: /images/authors/thomas-durand.webp
  linkedinUrl: ""
  jobTitle:
    fr: Rédacteur, logiciels et outils numériques
    en: Writer, software and digital tools
  role:
    fr: Logiciels, IA et outils numériques
    en: Software, AI and digital tools
  bio:
    fr: "Thomas Durand signe les articles de Club Digital consacrés aux logiciels et aux outils numériques des entreprises : CRM, intelligence artificielle, automatisation, cybersécurité, hébergement, paie et outils de collaboration. Ses articles expliquent le fonctionnement des outils et les critères pour les choisir, à partir des informations publiées par les éditeurs et des sources publiques citées dans chaque article."
    en: "Thomas Durand writes the Club Digital articles on business software and digital tools: CRM, artificial intelligence, automation, cybersecurity, hosting, payroll and collaboration tools. His articles explain how the tools work and how to choose them, based on information published by vendors and on the public sources cited in each article."
  expertise:
    - CRM
    - Intelligence artificielle
    - Automatisation
    - Cybersécurité
    - Hébergement et cloud
    - Logiciels de paie
    - Outils de collaboration
  topics:
