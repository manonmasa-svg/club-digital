{{ define "main" }}

<section class="error-page">
    <div class="container">
        <span class="error-code">404</span>
        <h1>{{ T "notFoundTitle" }}</h1>
        <p>{{ T "notFoundText" }}</p>
        <div class="error-links">
            <a href="{{ .Site.Home.RelPermalink }}" class="btn-primary">{{ T "backHome" }}</a>
            {{ with site.GetPage "/blog" }}<a href="{{ .RelPermalink }}" class="btn-outline">{{ T "seeArticles" }}</a>{{ end }}
        </div>
    </div>
</section>

{{ end }}
