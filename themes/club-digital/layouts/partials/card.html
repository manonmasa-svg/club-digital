{{/* Carte d'article. Contexte : une page d'article */}}
{{ $cat := index (.GetTerms "categories") 0 }}
<article class="article-card">
    <a href="{{ .RelPermalink }}" class="article-card-image-wrapper" tabindex="-1" aria-hidden="true">
        {{ with .Params.image }}
        <img src="{{ . | relURL }}" alt="" class="article-card-image" loading="lazy" width="600" height="400">
        {{ else }}
        <span class="article-card-image article-card-image-placeholder">{{ substr $.Title 0 1 }}</span>
        {{ end }}
    </a>
    <div class="article-card-body">
        <div class="article-meta">
            {{ with $cat }}<span class="article-category">{{ .LinkTitle }}</span>{{ end }}
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time>
        </div>
        <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
        <p>{{ .Description }}</p>
    </div>
</article>
