name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Publie les articles programmes. GitHub retarde souvent les crons de plusieurs heures :
    # on multiplie les creneaux le matin (6 h a 11 h UTC), a des minutes peu demandees (17 et 43)
    - cron: "5 6,7 * * *"
    - cron: "17,43 6-11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow_urls: ${{ steps.indexnow.outputs.urls }}
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v0.167.0/hugo_extended_0.167.0_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      # IndexNow : compare le sitemap en ligne (avant deploiement) au sitemap construit,
      # et garde seulement les URL nouvelles ou dont le lastmod a change
      - name: List changed URLs for IndexNow
        id: indexnow
        continue-on-error: true
        env:
          SITE: https://club-digital.fr
        run: |
          mkdir -p "${{ runner.temp }}/live"
          ok=1
          for lang in fr en; do
            curl -sfL "$SITE/$lang/sitemap.xml" -o "${{ runner.temp }}/live/$lang.xml" || ok=0
          done
          if [ "$ok" != "1" ]; then
            echo "Sitemap en ligne illisible : aucun envoi IndexNow"
            echo "urls=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "${{ runner.temp }}/live" public >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys, xml.etree.ElementTree as ET
          ns = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          def entries(path):
              out = {}
              for url in ET.parse(path).getroot().findall("s:url", ns):
                  loc = url.findtext("s:loc", default="", namespaces=ns).strip()
                  out[loc] = url.findtext("s:lastmod", default="", namespaces=ns).strip()
              return out
          live_dir, public_dir = sys.argv[1], sys.argv[2]
          changed = []
          for lang in ("fr", "en"):
              old = entries(f"{live_dir}/{lang}.xml")
              new = entries(f"{public_dir}/{lang}/sitemap.xml")
              changed += [loc for loc, mod in new.items() if old.get(loc) != mod]
          print("urls=" + json.dumps(changed[:1000]))
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Previent Bing (et les autres moteurs IndexNow) des URL nouvelles ou modifiees
  indexnow:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    continue-on-error: true
    if: needs.build.outputs.indexnow_urls != '[]' && needs.build.outputs.indexnow_urls != ''
    steps:
      - name: Submit URLs to IndexNow
        env:
          URLS: ${{ needs.build.outputs.indexnow_urls }}
          KEY: 42f8e66f80608e5bc905f00ef06a05f7
        run: |
          payload=$(jq -n --argjson urls "$URLS" --arg key "$KEY" \
            '{host: "club-digital.fr", key: $key, keyLocation: ("https://club-digital.fr/" + $key + ".txt"), urlList: $urls}')
          echo "$payload" | jq -r '.urlList[]'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$payload")
          echo "Reponse IndexNow : $code"
